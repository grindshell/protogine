[package]
name = "protogine"
version = "0.1.0"
edition = "2024"
default-run = "protogine-player"

[[bin]]
name = "protogine-player"
path = "src/bin/player.rs"
required-features = ["player"]

[[example]]
name = "script_host"
required-features = ["scripting"]

[features]
default = ["player"]
player = ["dep:macroquad", "dep:image"]
scripting = ["dep:mlua", "dep:tempfile", "dep:toml", "dep:yaml_serde"]

[dependencies]
macroquad = { version = "=0.4.16", default-features = false, optional = true }
image = { version = "0.24.9", default-features = false, features = ["png"], optional = true }
hecs = "=0.11.1"
mlua = { version = "=0.12.1", features = ["luau-jit"], optional = true }
tempfile = { version = "=3.27.0", optional = true }
toml = { version = "=1.1.4", optional = true }
yaml_serde = { version = "=0.10.7", optional = true }
tot = { git = "https://github.com/totlang/tot", rev = "2f407897f985654cdbb6201ad01ba05216a6e3d7", version = "=0.1.0" }

[dev-dependencies]
tempfile = "3.27.0"
