[package]
name = "protogine"
version = "0.1.0"
edition = "2024"
default-run = "protogine-player"

[workspace]
members = ["sdk", "tools/headergen"]
default-members = ["."]
resolver = "3"

[[bin]]
name = "protogine-player"
path = "src/bin/player.rs"
required-features = ["player"]

[[example]]
name = "script_host"
required-features = ["scripting"]

[[example]]
name = "native_benchmark"
required-features = ["scripting", "native-plugins"]

[[example]]
name = "png_sprite_probe"
required-features = ["player"]

[features]
default = ["player"]
player = ["dep:macroquad", "dep:image", "scripting", "native-plugins"]
scripting = ["dep:mlua", "dep:tempfile", "tot/toml", "tot/yaml"]
native-plugins = ["dep:libloading", "dep:protogine-plugin-api"]

[dependencies]
macroquad = { version = "=0.4.16", default-features = false, optional = true }
image = { version = "0.24.9", default-features = false, features = ["png"], optional = true }
hecs = "=0.11.1"
libloading = { version = "=0.9.0", optional = true }
protogine-plugin-api = { path = "sdk", optional = true }
mlua = { version = "=0.12.1", features = ["luau-jit"], optional = true }
tempfile = { version = "=3.27.0", optional = true }
tot = { git = "https://github.com/totlang/tot", rev = "031226fdcd930421580161faf6e8755bfba88517", version = "=0.2.0" }

[dev-dependencies]
tempfile = "3.27.0"
# Independently parse the scripting export fixtures.
toml = "=1.1.4"
yaml_serde = "=0.10.7"
