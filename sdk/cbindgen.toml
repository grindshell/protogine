language = "C"
include_guard = "PROTOGINE_PLUGIN_H"
autogen_warning = "/* Generated by cbindgen 0.29.2 from sdk/src/lib.rs. Do not edit. */"
documentation = true
cpp_compat = true
usize_is_size_t = true
style = "both"
header = """
/* ABI v1: x86_64-pc-windows-msvc, default C alignment/calling convention.
 * Trusted native code only. No exceptions, retained host buffers or background
 * callbacks. Exact table sizes/version are required; no implicit extensions.
 */
#if defined(_WIN32)
#define PG_PLUGIN_EXPORT __declspec(dllexport)
#else
#define PG_PLUGIN_EXPORT
#endif
"""

[export]
exclude = ["catch_status"]
